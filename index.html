<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edisel Hub</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#020105; }
  #c { display:block; width:100%; height:100%; }
  .plate {
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background:
      radial-gradient(ellipse 80% 60% at 50% 45%, rgba(30,22,14,.55), transparent 70%),
      radial-gradient(ellipse 50% 40% at 50% 50%, rgba(18,12,8,.4), transparent 60%);
  }
  .title {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:4; text-align:center; pointer-events:none;
    font-family:Georgia, serif; font-weight:bold;
    font-size:clamp(40px, 9vw, 110px); letter-spacing:.12em; text-transform:uppercase;
    color:#d9cbb0;
    text-shadow:
      1px 1px 0 #6b5a42,
      2px 2px 0 #5a4a34,
      3px 3px 0 #4a3c28,
      4px 4px 0 #3a2e1c,
      5px 5px 0 #2a2012,
      7px 9px 0 #1a140a,
      10px 14px 22px rgba(0,0,0,.85),
      0 0 60px rgba(180,130,70,.12);
  }
  .sub {
    position:fixed; top:calc(50% + clamp(48px, 10vw, 120px)); left:50%; transform:translateX(-50%);
    z-index:4; font-family:Georgia, serif; font-size:clamp(10px, 1.3vw, 14px);
    letter-spacing:.6em; color:#7a6a54; text-transform:uppercase; pointer-events:none;
  }
  .mods { position:fixed; inset:0; z-index:5; pointer-events:none; }
  .mod {
    position:absolute; transform:translate(-50%,-50%);
    font-family:Georgia, serif; font-size:clamp(12px, 1.5vw, 16px);
    letter-spacing:.4em; color:#cbb89a; text-transform:uppercase;
    text-shadow: 0 2px 8px rgba(0,0,0,.7), 0 0 18px rgba(160,120,60,.25);
    transition: color .5s, text-shadow .5s;
  }
  .mod:hover { color:#ffe9c8; text-shadow: 0 2px 10px rgba(0,0,0,.8), 0 0 30px rgba(220,170,90,.6); }
  .mod b { display:block; width:5px; height:5px; margin:7px auto 0; border-radius:50%; background:#e0b86a; box-shadow:0 0 10px rgba(220,170,90,.7); }
  .hint {
    position:fixed; bottom:6vh; left:50%; transform:translateX(-50%); z-index:5;
    font-size:10px; letter-spacing:.45em; color:#4a4034; text-transform:uppercase; pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="plate"></div>
<div class="title">Edisel Hub</div>
<div class="sub">una sola vida</div>
<div class="mods" id="mods"></div>
<div class="hint">toca o mueve</div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W,H,cx,cy,t=0,mx=.5,my=.5,go=false;
const mods=[
  {n:'Arte',a:-2.4},{n:'Mercado',a:-1.5},{n:'Rideshare',a:-.6},
  {n:'Escritura',a:.4},{n:'Finanzas',a:1.3},{n:'Vida',a:2.2}
];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;cx=W/2;cy=H/2;buildMods()}
function buildMods(){
  const box=document.getElementById('mods'); box.innerHTML='';
  const R=Math.min(W,H)*.30;
  mods.forEach(m=>{
    const e=document.createElement('div'); e.className='mod';
    e.innerHTML=m.n+'<b></b>';
    e.style.left=(cx+Math.cos(m.a)*R)+'px'; e.style.top=(cy+Math.sin(m.a)*R)+'px';
    box.appendChild(e);
  });
}
addEventListener('resize',rs);
addEventListener('pointermove',e=>{mx=e.clientX/W;my=e.clientY/H;go=true});
addEventListener('pointerleave',()=>go=false);
rs();

const noise=(x,y,s)=>(Math.sin(x*s+y*s*.7)+Math.sin(x*.7-y*s)+Math.cos(x*s*.5+y*s*.9))*.333;
const blobs=[];
for(let i=0;i<14;i++) blobs.push({x:.5+(Math.random()-.5)*.7,y:.5+(Math.random()-.5)*.6,r:.18+Math.random()*.35,c:i%3===0?'rgba(90,40,15,.07)':i%3===1?'rgba(50,25,10,.05)':'rgba(120,60,20,.04)',s:.3+Math.random()});

function frame(){
  t+=.0025;
  ctx.fillStyle='#020105'; ctx.fillRect(0,0,W,H);
  const vg=ctx.createRadialGradient(cx,cy,Math.min(W,H)*.2,cx,cy,Math.min(W,H)*.75);
  vg.addColorStop(0,'rgba(8,5,3,0)'); vg.addColorStop(1,'rgba(0,0,0,.85)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  blobs.forEach(b=>{
    const x=cx+(b.x-.5+Math.sin(t*b.s)*.03)*W;
    const y=cy+(b.y-.5+Math.cos(t*b.s*.7)*.03)*H;
    const r=Math.min(W,H)*b.r*(1+Math.sin(t*b.s*.5)*.05);
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,b.c); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,6.28); ctx.fill();
  });

  for(let i=0;i<180;i++){
    const z=(i%7+1)/7;
    const x=(Math.sin(i*12.7)*.5+.5*W + (mx-.5)*z*40 + Math.sin(t*z*2+i)*.8)%W;
    const y=(Math.cos(i*9.3)*.5+.5*H + (my-.5)*z*30 + Math.cos(t*z*1.5+i*.7)*.8)%H;
    const br=.25+z*.55+Math.sin(t*3+i)*.15;
    ctx.beginPath(); ctx.arc(x,y,z*1.4,0,6.28);
    ctx.fillStyle='rgba(255,235,205,'+Math.max(0,br)+')'; ctx.fill();
  }

  ctx.globalAlpha=.03;
  for(let i=0;i<900;i++){ctx.fillStyle='#fff';ctx.fillRect(Math.random()*W,Math.random()*H,1,1)}
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
