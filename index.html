<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edisel Hub</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#0a0a0f; font-family:'Segoe UI', system-ui, -apple-system, sans-serif; color:#e8e6e3; }
  canvas { position:fixed; inset:0; z-index:0; opacity:0.75; }
  .ui { position:relative; z-index:2; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:1.5rem; }
  h1 { font-size:clamp(2.4rem, 6vw, 5.2rem); font-weight:100; letter-spacing:.45em; text-transform:uppercase; background:linear-gradient(100deg, #d4af37, #f5e6c8, #d4af37); -webkit-background-clip:text; background-clip:text; color:transparent; animation: shimmer 8s ease-in-out infinite; text-shadow:0 0 50px rgba(212,175,55,.25); }
  @keyframes shimmer { 0%,100%{background-position:0% center} 50%{background-position:100% center} }
  .sub { margin-top:1.2rem; font-size:.85rem; letter-spacing:.5em; text-transform:uppercase; color:#a89f8f; opacity:0; animation: fadein 2.5s 0.6s forwards; }
  @keyframes fadein { to { opacity:1; } }
  .orbit { position:relative; width:min(90vw, 720px); height:min(90vw, 720px); margin-top:1.5rem; }
  .mod { position:absolute; width:160px; height:160px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; cursor:pointer; transition:all .6s cubic-bezier(.25,.8,.25,1); background:radial-gradient(circle at 30% 30%, rgba(212,175,55,.12), rgba(18,18,24,.75)); border:1px solid rgba(212,175,55,.18); backdrop-filter:blur(10px); opacity:0; }
  .mod:nth-child(1) { top:8%; left:50%; transform:translateX(-50%) scale(0.7); animation:pop1 1s .5s forwards; }
  .mod:nth-child(2) { top:28%; right:8%; transform:scale(0.7); animation:pop 1s .7s forwards; }
  .mod:nth-child(3) { bottom:28%; right:8%; transform:scale(0.7); animation:pop 1s .9s forwards; }
  .mod:nth-child(4) { bottom:8%; left:50%; transform:translateX(-50%) scale(0.7); animation:pop4 1s 1.1s forwards; }
  .mod:nth-child(5) { bottom:28%; left:8%; transform:scale(0.7); animation:pop 1s 1.3s forwards; }
  .mod:nth-child(6) { top:28%; left:8%; transform:scale(0.7); animation:pop 1s 1.5s forwards; }
  @keyframes pop { to { opacity:1; transform:scale(1); } }
  @keyframes pop1 { to { opacity:1; transform:translateX(-50%) scale(1); } }
  @keyframes pop4 { to { opacity:1; transform:translateX(-50%) scale(1); } }
  .mod:hover { border-color:#d4af37; box-shadow:0 0 40px rgba(212,175,55,.25), inset 0 0 20px rgba(212,175,55,.08); }
  .mod:nth-child(1):hover { transform:translateX(-50%) scale(1.1); }
  .mod:nth-child(2):hover, .mod:nth-child(3):hover, .mod:nth-child(5):hover, .mod:nth-child(6):hover { transform:scale(1.1); }
  .mod:nth-child(4):hover { transform:translateX(-50%) scale(1.1); }
  .mod svg { width:42px; height:42px; margin-bottom:.5rem; stroke:#d4af37; fill:none; stroke-width:1.2; filter:drop-shadow(0 0 4px rgba(212,175,55,.4)); transition:transform .5s; }
  .mod:hover svg { transform:scale(1.15) rotate(8deg); }
  .mod h3 { font-size:.82rem; letter-spacing:.26em; text-transform:uppercase; color:#f0e6d0; font-weight:400; }
  .mod p { margin-top:.35rem; font-size:.6rem; color:#8a8794; letter-spacing:.07em; line-height:1.3; max-width:125px; }
  .center { position:absolute; top:50%; left:50%; width:130px; height:130px; border-radius:50%; transform:translate(-50%,-50%); border:1px solid rgba(212,175,55,.12); display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .center span { font-size:.65rem; letter-spacing:.45em; text-transform:uppercase; color:#d4af37; opacity:.5; }
  .overlay { position:fixed; inset:0; z-index:20; background:rgba(10,10,15,.94); backdrop-filter:blur(18px); display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .7s ease; }
  .overlay.open { opacity:1; pointer-events:auto; }
  .overlay h2 { font-size:clamp(1.8rem,4vw,3rem); letter-spacing:.3em; text-transform:uppercase; color:#d4af37; margin-bottom:1rem; }
  .overlay p { max-width:460px; text-align:center; color:#c8c4bc; letter-spacing:.06em; line-height:1.65; font-size:.95rem; padding:0 1rem; }
  .overlay .close { position:absolute; top:2rem; right:2rem; font-size:1.6rem; color:#a89f8f; cursor:pointer; background:none; border:none; transition:color .3s, transform .3s; }
  .overlay .close:hover { color:#d4af37; transform:scale(1.1); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <h1>Edisel Hub</h1>
  <div class="sub">Un solo lugar · Una sola vida</div>
  <div class="orbit">
    <div class="center"><span>HUB</span></div>
    <div class="mod" data-m="arte">
      <svg viewBox="0 0 64 64"><path d="M32 8c0 12 8 16 8 24s-8 12-8 24M32 8c0 12-8 16-8 24s8 12 8 24M20 32h24" stroke-linecap="round"/></svg>
      <h3>Arte</h3><p>Luz, cuerpo y movimiento</p>
    </div>
    <div class="mod" data-m="mercado">
      <svg viewBox="0 0 64 64"><path d="M12 44l10-16 8 10 10-18 12 24" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="32" r="20" stroke-opacity=".4"/></svg>
      <h3>Mercado</h3><p>Flujos y decisiones</p>
    </div>
    <div class="mod" data-m="rideshare">
      <svg viewBox="0 0 64 64"><path d="M8 40c8-12 16-8 24-16s16-4 24 8" stroke-linecap="round"/><circle cx="20" cy="42" r="4"/><circle cx="44" cy="42" r="4"/></svg>
      <h3>Rideshare</h3><p>El camino diario</p>
    </div>
    <div class="mod" data-m="escritura">
      <svg viewBox="0 0 64 64"><path d="M16 48c8-16 16-8 24-20 4 8 8 12 16 4" stroke-linecap="round"/><path d="M20 20c4 2 8 0 12-4" stroke-linecap="round"/></svg>
      <h3>Escritura</h3><p>La palabra viva</p>
    </div>
    <div class="mod" data-m="finanzas">
      <svg viewBox="0 0 64 64"><path d="M12 32h40M32 12v40M20 20l24 24M44 20L20 44" stroke-linecap="round"/><circle cx="32" cy="32" r="18" stroke-opacity=".5"/></svg>
      <h3>Finanzas</h3><p>El pulso del dinero</p>
    </div>
    <div class="mod" data-m="vida">
      <svg viewBox="0 0 64 64"><path d="M32 12c8 8 12 16 12 24s-4 16-12 16-12-8-12-16 4-16 12-24z" stroke-linecap="round"/><path d="M32 28v16M26 36h12" stroke-linecap="round"/></svg>
      <h3>Vida</h3><p>Lo que permanece</p>
    </div>
  </div>
</div>
<div class="overlay" id="ov">
  <button class="close" id="cl">✕</button>
  <h2 id="ovt"></h2>
  <p id="ovp">Próximamente el contenido de este módulo.</p>
</div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H,pts=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;pts=[];for(let i=0;i<70;i++)pts.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,a:Math.random()*.35+.12});}
rs();addEventListener('resize',rs);
let t=0;
function draw(){
  t+=.007;
  cx.fillStyle='rgba(10,10,15,.16)';cx.fillRect(0,0,W,H);
  for(const p of pts){
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);
    cx.fillStyle=`rgba(212,175,55,${p.a})`;cx.fill();
  }
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
    const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);
    if(d<130){cx.beginPath();cx.moveTo(pts[i].x,pts[i].y);cx.lineTo(pts[j].x,pts[j].y);cx.strokeStyle=`rgba(212,175,55,${.05*(1-d/130)})`;cx.lineWidth=0.5;cx.stroke();}
  }
  cx.save();cx.translate(W/2,H/2);
  for(let i=0;i<3;i++){
    cx.beginPath();
    for(let a=0;a<Math.PI*10;a+=.03){
      const rr=a*8+i*35+Math.sin(t*1.2+a)*10;
      const x=Math.cos(a+t*0.6+i)*rr,y=Math.sin(a+t*0.6+i)*rr;
      if(a===0)cx.moveTo(x,y);else cx.lineTo(x,y);
    }
    cx.strokeStyle=`rgba(212,175,55,${.1-i*.03})`;cx.lineWidth=0.7;cx.stroke();
  }
  cx.restore();
  requestAnimationFrame(draw);
}
draw();
const modules = {
  arte: 'Cinema Corporal y Fly Dance. La luz corta, la cámara mira y la espiral nace en la cadera.',
  mercado: 'Bolsa e inversiones. Decisiones conscientes sobre el dinero que trabaja.',
  rideshare: 'Uber y Lyft. El camino diario, las ganancias y el movimiento de la ciudad.',
  escritura: 'Blog, poemas y voz. La palabra que regresa después del silencio.',
  finanzas: 'Schwab, SoFi y flujos. El pulso real de lo que entra y sale.',
  vida: 'Familia, raíces y Cuba. Lo que permanece cuando todo lo demás cambia.'
};
document.querySelectorAll('.mod').forEach(m=>m.addEventListener('click',()=>{
  const key = m.dataset.m;
  document.getElementById('ovt').textContent = m.querySelector('h3').textContent;
  document.getElementById('ovp').textContent = modules[key] || 'Próximamente.';
  document.getElementById('ov').classList.add('open');
}));
document.getElementById('cl').addEventListener('click',()=>document.getElementById('ov').classList.remove('open'));
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')document.getElementById('ov').classList.remove('open');});
</script>
</body>
</html>
