<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edisel Hub</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#000; color:#e8e4dc; font-family:Georgia, 'Times New Roman', serif; }
  canvas { position:fixed; inset:0; z-index:0; }
  .vignette { position:fixed; inset:0; z-index:1; pointer-events:none; background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.7) 100%); }
  .words { position:fixed; inset:0; z-index:2; pointer-events:none; }
  .word { position:absolute; pointer-events:auto; cursor:pointer; font-size:clamp(1.4rem, 2.8vw, 2.2rem); letter-spacing:.22em; text-transform:uppercase; color:#d4af37; opacity:0; transition:opacity 1.2s, text-shadow .4s; text-shadow:0 0 20px rgba(212,175,55,.3); animation:breathe 6s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{text-shadow:0 0 20px rgba(212,175,55,.3)} 50%{text-shadow:0 0 35px rgba(212,175,55,.6)} }
  .word:hover { text-shadow:0 0 50px rgba(212,175,55,.9); transform:scale(1.1); }
  .title { position:fixed; bottom:8vh; left:6vw; z-index:3; font-size:clamp(2.8rem, 6vw, 5.5rem); font-weight:300; letter-spacing:.12em; line-height:.85; color:#f5e6c8; pointer-events:none; text-shadow:0 0 40px rgba(212,175,55,.5); animation:breathe 8s ease-in-out infinite; }
  .title span { display:block; font-size:.35em; letter-spacing:.6em; margin-top:.8rem; color:#a89f8f; }
  .overlay { position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.94); display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .9s; padding:3rem; }
  .overlay.open { opacity:1; pointer-events:auto; }
  .overlay h2 { font-size:clamp(2rem, 5vw, 3.5rem); letter-spacing:.3em; text-transform:uppercase; color:#d4af37; margin-bottom:1.5rem; font-weight:300; }
  .overlay p { max-width:480px; text-align:center; font-style:italic; line-height:1.75; font-size:1.1rem; color:#c8c4bc; }
  .overlay .close { position:absolute; top:2.5rem; right:2.5rem; color:#a89f8f; cursor:pointer; letter-spacing:.3em; font-size:.9rem; background:none; border:none; }
  .overlay .close:hover { color:#d4af37; }
  .hint { position:fixed; bottom:2vh; right:4vw; z-index:3; font-size:.7rem; letter-spacing:.4em; color:#a89f8f; opacity:.5; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="words" id="words"></div>
<div class="title">Edisel<span>la espiral nace aquí</span></div>
<div class="hint">toca para sentir</div>
<div class="overlay" id="ov">
  <button class="close" id="cl">volver</button>
  <h2 id="ovt"></h2>
  <p id="ovp"></p>
</div>
<script>
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let W, H, t = 0, mouse = {x:0, y:0}, audioCtx, osc, gain;
const wordsData = [
  {name:'Arte', key:'arte', angle:0.4, dist:0.28},
  {name:'Mercado', key:'mercado', angle:1.2, dist:0.38},
  {name:'Rideshare', key:'rideshare', angle:2.1, dist:0.32},
  {name:'Escritura', key:'escritura', angle:3.0, dist:0.42},
  {name:'Finanzas', key:'finanzas', angle:4.0, dist:0.30},
  {name:'Vida', key:'vida', angle:5.1, dist:0.36}
];
const texts = {
  arte: 'La luz corta, la cámara mira y la espiral nace en la cadera. Cinema Corporal y Fly Dance viven aquí.',
  mercado: 'Bolsa e inversiones. Decisiones conscientes sobre el dinero que trabaja.',
  rideshare: 'Uber y Lyft. El camino diario, las ganancias y el movimiento de la ciudad.',
  escritura: 'Blog, poemas y voz. La palabra que regresa después del silencio.',
  finanzas: 'Schwab, SoFi y flujos. El pulso real de lo que entra y sale.',
  vida: 'Familia, raíces y Cuba. Lo que permanece cuando todo lo demás cambia.'
};
function startAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  osc = audioCtx.createOscillator();
  gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 110;
  gain.gain.value = 0.015;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
}
function resize() {
  W = cv.width = innerWidth;
  H = cv.height = innerHeight;
  document.querySelectorAll('.word').forEach(el => el.remove());
  wordsData.forEach(w => {
    const el = document.createElement('div');
    el.className = 'word';
    el.textContent = w.name;
    el.dataset.key = w.key;
    document.getElementById('words').appendChild(el);
    setTimeout(() => el.style.opacity = '1', 800 + Math.random()*600);
    el.addEventListener('click', () => {
      startAudio();
      document.getElementById('ovt').textContent = w.name;
      document.getElementById('ovp').textContent = texts[w.key];
      document.getElementById('ov').classList.add('open');
    });
  });
}
resize();
addEventListener('resize', resize);
function updateMouse(x, y) {
  mouse.x = x / W - 0.5;
  mouse.y = y / H - 0.5;
  if (gain) gain.gain.setTargetAtTime(0.015 + Math.abs(mouse.x)*0.03, audioCtx.currentTime, 0.1);
  if (osc) osc.frequency.setTargetAtTime(90 + Math.abs(mouse.y)*80, audioCtx.currentTime, 0.15);
}
addEventListener('mousemove', e => updateMouse(e.clientX, e.clientY));
addEventListener('touchmove', e => { e.preventDefault(); updateMouse(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
addEventListener('click', startAudio);
const trails = [];
function draw() {
  t += 0.005;
  cx.fillStyle = 'rgba(0,0,0,0.1)';
  cx.fillRect(0,0,W,H);
  const cx0 = W/2 + mouse.x * 60;
  const cy0 = H/2 + mouse.y * 60;
  // particles following mouse
  if (Math.random() < 0.4) trails.push({x: cx0 + (Math.random()-0.5)*40, y: cy0 + (Math.random()-0.5)*40, life:1, vx:(Math.random()-0.5)*1.2, vy:(Math.random()-0.5)*1.2});
  for (let i = trails.length-1; i>=0; i--) {
    const p = trails[i];
    p.x += p.vx; p.y += p.vy; p.life -= 0.012;
    if (p.life <= 0) { trails.splice(i,1); continue; }
    cx.beginPath();
    cx.arc(p.x, p.y, p.life*2.5, 0, Math.PI*2);
    cx.fillStyle = `rgba(212,175,55,${p.life*0.4})`;
    cx.fill();
  }
  cx.save();
  cx.translate(cx0, cy0);
  for (let s = 0; s < 3; s++) {
    cx.beginPath();
    for (let a = 0; a < Math.PI * 16; a += 0.015) {
      const r = a * 8.5 + s * 22 + Math.sin(t * 1.8 + a + mouse.x*2) * 8;
      const x = Math.cos(a + t*0.8 + s * 0.6) * r;
      const y = Math.sin(a + t*0.8 + s * 0.6) * r;
      if (a === 0) cx.moveTo(x, y); else cx.lineTo(x, y);
    }
    cx.strokeStyle = `rgba(212,175,55,${0.18 - s*0.05})`;
    cx.lineWidth = 0.9;
    cx.stroke();
  }
  cx.restore();
  document.querySelectorAll('.word').forEach((el, i) => {
    const w = wordsData[i];
    const a = w.angle + t * 0.25;
    const r = Math.min(W, H) * w.dist * (1 + Math.sin(t + i)*0.05);
    const x = cx0 + Math.cos(a) * r - el.offsetWidth / 2;
    const y = cy0 + Math.sin(a) * r - el.offsetHeight / 2;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  });
  requestAnimationFrame(draw);
}
draw();
document.getElementById('cl').addEventListener('click', () => document.getElementById('ov').classList.remove('open'));
document.getElementById('ov').addEventListener('click', e => { if (e.target.id === 'ov') document.getElementById('ov').classList.remove('open'); });
</script>
</body>
</html>
