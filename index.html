<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edisel Hub</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#000; color:#e8e4dc; font-family:Georgia, 'Times New Roman', serif; }
  canvas { position:fixed; inset:0; z-index:0; }
  .words { position:fixed; inset:0; z-index:2; pointer-events:none; }
  .word { position:absolute; pointer-events:auto; cursor:pointer; font-size:clamp(1.3rem, 2.4vw, 1.9rem); letter-spacing:.2em; text-transform:uppercase; color:#d4af37; opacity:0; text-shadow:0 0 15px rgba(212,175,55,.4); transition:opacity 1.5s, text-shadow .5s, transform .5s; }
  .word:hover { text-shadow:0 0 30px rgba(212,175,55,.9); transform:scale(1.06); }
  .title { position:fixed; bottom:7vh; left:5vw; z-index:3; font-size:clamp(2.6rem, 5.5vw, 5rem); font-weight:300; letter-spacing:.1em; line-height:.85; color:#f5e6c8; pointer-events:none; text-shadow:0 0 30px rgba(212,175,55,.4); }
  .title span { display:block; font-size:.32em; letter-spacing:.55em; margin-top:.7rem; color:#a89f8f; }
  .overlay { position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.95); display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .8s; padding:3rem; }
  .overlay.open { opacity:1; pointer-events:auto; }
  .overlay h2 { font-size:clamp(1.9rem, 4.5vw, 3.2rem); letter-spacing:.28em; text-transform:uppercase; color:#d4af37; margin-bottom:1.4rem; font-weight:300; }
  .overlay p { max-width:460px; text-align:center; font-style:italic; line-height:1.75; font-size:1.05rem; color:#c8c4bc; }
  .overlay .close { position:absolute; top:2.2rem; right:2.2rem; color:#a89f8f; cursor:pointer; letter-spacing:.3em; font-size:.85rem; background:none; border:none; }
  .overlay .close:hover { color:#d4af37; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="words" id="words"></div>
<div class="title">Edisel<span>el universo nace aquí</span></div>
<div class="overlay" id="ov">
  <button class="close" id="cl">volver</button>
  <h2 id="ovt"></h2>
  <p id="ovp"></p>
</div>
<script>
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let W, H, t = 0;
const stars = [];
const wordsData = [
  {name:'Arte', key:'arte', angle:0.6, dist:0.22},
  {name:'Mercado', key:'mercado', angle:1.5, dist:0.32},
  {name:'Rideshare', key:'rideshare', angle:2.4, dist:0.28},
  {name:'Escritura', key:'escritura', angle:3.3, dist:0.36},
  {name:'Finanzas', key:'finanzas', angle:4.2, dist:0.25},
  {name:'Vida', key:'vida', angle:5.2, dist:0.34}
];
const texts = {
  arte: 'La luz corta, la cámara mira y la espiral nace en la cadera. Cinema Corporal y Fly Dance viven aquí.',
  mercado: 'Bolsa e inversiones. Decisiones conscientes sobre el dinero que trabaja.',
  rideshare: 'Uber y Lyft. El camino diario, las ganancias y el movimiento de la ciudad.',
  escritura: 'Blog, poemas y voz. La palabra que regresa después del silencio.',
  finanzas: 'Schwab, SoFi y flujos. El pulso real de lo que entra y sale.',
  vida: 'Familia, raíces y Cuba. Lo que permanece cuando todo lo demás cambia.'
};
function resize() {
  W = cv.width = innerWidth;
  H = cv.height = innerHeight;
  stars.length = 0;
  for (let i = 0; i < 180; i++) stars.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.2, a:Math.random()*0.6+0.2});
  document.querySelectorAll('.word').forEach(el => el.remove());
  wordsData.forEach(w => {
    const el = document.createElement('div');
    el.className = 'word';
    el.textContent = w.name;
    document.getElementById('words').appendChild(el);
    setTimeout(() => el.style.opacity = '1', 1000 + Math.random()*800);
    el.addEventListener('click', () => {
      document.getElementById('ovt').textContent = w.name;
      document.getElementById('ovp').textContent = texts[w.key];
      document.getElementById('ov').classList.add('open');
    });
  });
}
resize();
addEventListener('resize', resize);
function draw() {
  t += 0.002;
  cx.fillStyle = 'rgba(0,0,0,0.08)';
  cx.fillRect(0,0,W,H);
  // stars
  for (const s of stars) {
    cx.beginPath();
    cx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    cx.fillStyle = `rgba(255,230,180,${s.a * (0.6 + Math.sin(t*2 + s.x)*0.4)})`;
    cx.fill();
  }
  const cx0 = W/2;
  const cy0 = H/2;
  cx.save();
  cx.translate(cx0, cy0);
  // galactic spiral arms
  for (let arm = 0; arm < 2; arm++) {
    cx.beginPath();
    for (let a = 0; a < Math.PI * 10; a += 0.02) {
      const r = a * 12 + arm * 30 + Math.sin(t*0.5 + a)*4;
      const x = Math.cos(a + t*0.15 + arm*Math.PI) * r;
      const y = Math.sin(a + t*0.15 + arm*Math.PI) * r;
      if (a === 0) cx.moveTo(x, y); else cx.lineTo(x, y);
    }
    cx.strokeStyle = `rgba(212,175,55,${0.12 - arm*0.04})`;
    cx.lineWidth = 1.2;
    cx.stroke();
  }
  // soft nebula glow
  const g = cx.createRadialGradient(0,0,0,0,0,Math.min(W,H)*0.35);
  g.addColorStop(0, 'rgba(212,175,55,0.08)');
  g.addColorStop(0.5, 'rgba(212,175,55,0.03)');
  g.addColorStop(1, 'transparent');
  cx.fillStyle = g;
  cx.beginPath();
  cx.arc(0,0,Math.min(W,H)*0.4,0,Math.PI*2);
  cx.fill();
  cx.restore();
  // place words gently along the arms
  document.querySelectorAll('.word').forEach((el, i) => {
    const w = wordsData[i];
    const a = w.angle + t * 0.08;
    const r = Math.min(W, H) * w.dist;
    const x = cx0 + Math.cos(a) * r - el.offsetWidth / 2;
    const y = cy0 + Math.sin(a) * r - el.offsetHeight / 2;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  });
  requestAnimationFrame(draw);
}
draw();
document.getElementById('cl').addEventListener('click', () => document.getElementById('ov').classList.remove('open'));
document.getElementById('ov').addEventListener('click', e => { if (e.target.id === 'ov') document.getElementById('ov').classList.remove('open'); });
</script>
</body>
</html>
