<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edisel Hub</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#050507; font-family:'Georgia', 'Times New Roman', serif; color:#e8e4dc; }
  canvas { position:fixed; inset:0; z-index:0; opacity:0.85; }
  .ui { position:relative; z-index:2; height:100vh; display:flex; flex-direction:column; justify-content:center; padding:4vw 6vw; }
  h1 { font-size:clamp(3.5rem, 9vw, 7.5rem); font-weight:300; letter-spacing:.15em; line-height:.9; color:#f5e6c8; text-shadow:0 0 60px rgba(212,175,55,.4); }
  .sub { margin-top:1.5rem; font-size:clamp(.9rem, 1.8vw, 1.1rem); letter-spacing:.6em; text-transform:uppercase; color:#a89f8f; font-family:system-ui, sans-serif; }
  .modules { margin-top:6vh; display:flex; flex-direction:column; gap:2.2rem; max-width:520px; }
  .mod { display:flex; align-items:center; gap:1.8rem; cursor:pointer; opacity:0; transform:translateX(-30px); transition:all .6s cubic-bezier(.2,.8,.2,1); }
  .mod:nth-child(1){animation:in .9s .3s forwards} .mod:nth-child(2){animation:in .9s .5s forwards} .mod:nth-child(3){animation:in .9s .7s forwards} .mod:nth-child(4){animation:in .9s .9s forwards} .mod:nth-child(5){animation:in .9s 1.1s forwards} .mod:nth-child(6){animation:in .9s 1.3s forwards}
  @keyframes in { to { opacity:1; transform:none; } }
  .mod:hover { transform:translateX(12px); }
  .mod svg { width:48px; height:48px; flex-shrink:0; stroke:#d4af37; fill:none; stroke-width:1.1; opacity:.85; transition:all .5s; }
  .mod:hover svg { opacity:1; transform:rotate(15deg) scale(1.1); filter:drop-shadow(0 0 12px rgba(212,175,55,.6)); }
  .mod-text h3 { font-size:1.35rem; letter-spacing:.18em; text-transform:uppercase; color:#f0e6d0; font-weight:400; }
  .mod-text p { margin-top:.3rem; font-size:.78rem; color:#8a8794; letter-spacing:.12em; font-family:system-ui, sans-serif; }
  .overlay { position:fixed; inset:0; z-index:30; background:rgba(5,5,7,.96); backdrop-filter:blur(20px); display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .8s; padding:2rem; }
  .overlay.open { opacity:1; pointer-events:auto; }
  .overlay h2 { font-size:clamp(2.2rem, 5vw, 3.8rem); letter-spacing:.25em; text-transform:uppercase; color:#d4af37; margin-bottom:1.5rem; font-weight:300; }
  .overlay p { max-width:520px; text-align:center; color:#c8c4bc; letter-spacing:.05em; line-height:1.7; font-size:1.05rem; font-style:italic; }
  .overlay .close { position:absolute; top:2.5rem; right:2.5rem; font-size:1.4rem; color:#a89f8f; cursor:pointer; background:none; border:none; letter-spacing:.2em; }
  .overlay .close:hover { color:#d4af37; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <h1>Edisel<br>Hub</h1>
  <div class="sub">La luz corta · La cámara mira</div>
  <div class="modules">
    <div class="mod" data-m="arte">
      <svg viewBox="0 0 64 64"><path d="M32 10c8 6 12 14 12 22s-4 16-12 22c-8-6-12-14-12-22s4-16 12-22z" stroke-linecap="round"/><path d="M32 18c4 3 6 7 6 14s-2 11-6 14" stroke-linecap="round"/><path d="M24 32h16" stroke-linecap="round"/></svg>
      <div class="mod-text"><h3>Arte</h3><p>Cinema Corporal · la espiral nace en la cadera</p></div>
    </div>
    <div class="mod" data-m="mercado">
      <svg viewBox="0 0 64 64"><path d="M10 46c6-8 12-4 18-12s12-6 18 2 8 10 8 10" stroke-linecap="round"/><circle cx="32" cy="32" r="22" stroke-opacity=".3"/></svg>
      <div class="mod-text"><h3>Mercado</h3><p>Flujos que deciden</p></div>
    </div>
    <div class="mod" data-m="rideshare">
      <svg viewBox="0 0 64 64"><path d="M8 38c10-14 18-6 26-14s14-2 22 6" stroke-linecap="round"/><path d="M18 44h28" stroke-linecap="round"/></svg>
      <div class="mod-text"><h3>Rideshare</h3><p>El camino que se mueve</p></div>
    </div>
    <div class="mod" data-m="escritura">
      <svg viewBox="0 0 64 64"><path d="M14 50c6-18 14-10 22-22 6 10 10 8 14 2" stroke-linecap="round"/><path d="M18 22c6 4 10 2 14-2" stroke-linecap="round"/></svg>
      <div class="mod-text"><h3>Escritura</h3><p>La palabra que vuelve</p></div>
    </div>
    <div class="mod" data-m="finanzas">
      <svg viewBox="0 0 64 64"><path d="M12 32h40M32 12v40" stroke-linecap="round"/><path d="M18 22l28 20M46 22L18 42" stroke-linecap="round"/></svg>
      <div class="mod-text"><h3>Finanzas</h3><p>El pulso real</p></div>
    </div>
    <div class="mod" data-m="vida">
      <svg viewBox="0 0 64 64"><path d="M32 14c10 8 14 16 14 24s-4 16-14 16-14-8-14-16 4-16 14-24z" stroke-linecap="round"/><circle cx="32" cy="34" r="4"/></svg>
      <div class="mod-text"><h3>Vida</h3><p>Lo que permanece</p></div>
    </div>
  </div>
</div>
<div class="overlay" id="ov">
  <button class="close" id="cl">cerrar</button>
  <h2 id="ovt"></h2>
  <p id="ovp"></p>
</div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H,pts=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;pts=[];for(let i=0;i<90;i++)pts.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,a:Math.random()*.3+.1});}
rs();addEventListener('resize',rs);
let t=0;
function draw(){
  t+=.006;
  cx.fillStyle='rgba(5,5,7,.14)';cx.fillRect(0,0,W,H);
  for(const p of pts){
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);
    cx.fillStyle=`rgba(212,175,55,${p.a})`;cx.fill();
  }
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
    const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);
    if(d<110){cx.beginPath();cx.moveTo(pts[i].x,pts[i].y);cx.lineTo(pts[j].x,pts[j].y);cx.strokeStyle=`rgba(212,175,55,${.04*(1-d/110)})`;cx.lineWidth=0.4;cx.stroke();}
  }
  cx.save();cx.translate(W*.65,H*.55);
  for(let i=0;i<2;i++){
    cx.beginPath();
    for(let a=0;a<Math.PI*12;a+=.025){
      const rr=a*7+i*40+Math.sin(t+a)*8;
      const x=Math.cos(a+t*.5+i)*rr,y=Math.sin(a+t*.5+i)*rr;
      if(a===0)cx.moveTo(x,y);else cx.lineTo(x,y);
    }
    cx.strokeStyle=`rgba(212,175,55,${.08-i*.03})`;cx.lineWidth=0.6;cx.stroke();
  }
  cx.restore();
  requestAnimationFrame(draw);
}
draw();
const modules = {
  arte: 'La luz corta, la cámara mira y la espiral nace en la cadera. Cinema Corporal y Fly Dance viven aquí.',
  mercado: 'Bolsa e inversiones. Decisiones conscientes sobre el dinero que trabaja.',
  rideshare: 'Uber y Lyft. El camino diario, las ganancias y el movimiento de la ciudad.',
  escritura: 'Blog, poemas y voz. La palabra que regresa después del silencio.',
  finanzas: 'Schwab, SoFi y flujos. El pulso real de lo que entra y sale.',
  vida: 'Familia, raíces y Cuba. Lo que permanece cuando todo lo demás cambia.'
};
document.querySelectorAll('.mod').forEach(m=>m.addEventListener('click',()=>{
  const key = m.dataset.m;
  document.getElementById('ovt').textContent = m.querySelector('h3').textContent;
  document.getElementById('ovp').textContent = modules[key] || 'Próximamente.';
  document.getElementById('ov').classList.add('open');
}));
document.getElementById('cl').addEventListener('click',()=>document.getElementById('ov').classList.remove('open'));
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')document.getElementById('ov').classList.remove('open');});
</script>
</body>
</html>
